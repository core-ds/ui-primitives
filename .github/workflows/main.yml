name: main

on:
    pull_request:
    merge_group:
        branches:
            - master

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.sha }}
    cancel-in-progress: true

jobs:
    codegen:
        if: ${{ github.repository == 'core-ds/ui-primitives' && github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup CI
              uses: $/.github/actions/ci-setup

            - name: Bootstrap
              run: |
                  pnpm bootstrap

            - name: Codegen
              env:
                  FIGMA_FLAG_FILE_KEY: ${{ secrets.FIGMA_FLAG_FILE_KEY }}
                  FIGMA_ICON_FILE_KEY: ${{ secrets.FIGMA_ICON_FILE_KEY }}
                  FIGMA_LOGO_FILE_KEY: ${{ secrets.FIGMA_LOGO_FILE_KEY }}
                  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
              run: |
                  pnpm codegen

            - name: Check if should update branch
              uses: actions/github-script@v9
              with:
                  script: |
                      const { stdout } = await exec.getExecOutput('git', ['status', '--porcelain']);

                      if (stdout.trim().length > 0) {
                          core.setFailed("Codegen check failed");
                      }

    build:
        needs: codegen
        if: always() && (github.event_name != 'pull_request' || needs.codegen.result == 'success')
        runs-on: ubuntu-latest
        outputs:
            pack-cdn-artifact-id: ${{ steps.upload.outputs.artifact-id }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup CI
              uses: $/.github/actions/ci-setup

            - name: Bootstrap
              run: |
                  pnpm bootstrap

            - name: Build
              run: |
                  pnpm build
                  pnpm build-cdn-dist

            - name: Upload dist
              uses: actions/upload-artifact@v7
              with:
                  retention-days: 1
                  name: dist
                  path: |
                      icons-demo/dist
                      packages/*/dist
                      scripts/*/dist
                      token-converter/dist

            - name: Upload cdn dist
              id: upload
              uses: actions/upload-artifact@v7
              with:
                  retention-days: 1
                  name: cdn-dist
                  path: cdn-dist

    lint:
        needs: codegen
        if: always() && (github.event_name != 'pull_request' || needs.codegen.result == 'success')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup CI
              uses: $/.github/actions/ci-setup

            - name: Bootstrap
              run: |
                  pnpm bootstrap

            - name: Format
              run: |
                  pnpm format-check

            - name: Lint js
              run: |
                  pnpm lint-js

            - name: Lint icons
              run: |
                  pnpm lint-icons

    icons-demo:
        if: ${{ always() && needs.build.result == 'success' && github.repository == 'core-ds/ui-primitives' }}
        needs: build
        runs-on: ubuntu-latest
        outputs:
            url: ${{ format('https://core-ds.github.io/icons-demo/{0}', case(github.event_name == 'pull_request', github.event.pull_request.number, '')) }}
        concurrency:
            group: deploy-icons-demo
            cancel-in-progress: false
            queue: max
        steps:
            - name: Create app token
              uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  client-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: icons-demo
                  permission-contents: write
                  permission-pull-requests: write

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  repository: ${{ github.repository_owner }}/icons-demo
                  ref: gh-pages

            - name: Download dist
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: ${{ runner.temp }}/dist

            - name: Clean
              run: |
                  rm -rf ${{ case(github.event_name == 'pull_request', github.event.pull_request.number, 'index.html build') }}

            - name: Make directory
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  mkdir ${{ github.event.pull_request.number }}

            - name: Copy files
              run: |
                  cp    ${{ runner.temp }}/dist/icons-demo/dist/index.html ${{ case(github.event_name == 'pull_request', github.event.pull_request.number, '.') }}
                  cp -r ${{ runner.temp }}/dist/icons-demo/dist/build      ${{ case(github.event_name == 'pull_request', github.event.pull_request.number, '.') }}

            - name: Commit and push
              uses: core-ds/ui-primitives/.github/actions/commit-and-push@master
              with:
                  message: Deploy demo

    token-converter:
        if: ${{ always() && needs.build.result == 'success' && github.repository == 'core-ds/ui-primitives' }}
        needs: build
        runs-on: ubuntu-latest
        outputs:
            url: ${{ format('https://core-ds.github.io/ui-primitives/{0}', case(github.event_name == 'pull_request', github.event.pull_request.number, '')) }}
        concurrency:
            group: deploy-token-converter
            cancel-in-progress: false
            queue: max
        steps:
            - name: Create app token
              uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  client-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  ref: gh-pages

            - name: Download dist
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: ${{ runner.temp }}/dist

            - name: Clean
              working-directory: docs
              run: |
                  rm -rf ${{ case(github.event_name == 'pull_request', github.event.pull_request.number, 'index.html icon.svg assets') }}

            - name: Make directory
              if: ${{ github.event_name == 'pull_request' }}
              working-directory: docs
              run: |
                  mkdir ${{ github.event.pull_request.number }}

            - name: Copy files
              working-directory: docs
              run: |
                  cp    ${{ runner.temp }}/dist/token-converter/dist/index.html ${{ case(github.event_name == 'pull_request', github.event.pull_request.number, '.') }}
                  cp    ${{ runner.temp }}/dist/token-converter/dist/icon.svg   ${{ case(github.event_name == 'pull_request', github.event.pull_request.number, '.') }}
                  cp -r ${{ runner.temp }}/dist/token-converter/dist/assets     ${{ case(github.event_name == 'pull_request', github.event.pull_request.number, '.') }}

            - name: Commit and push
              uses: core-ds/ui-primitives/.github/actions/commit-and-push@master
              with:
                  message: Deploy demo

    comment:
        runs-on: ubuntu-latest
        needs:
            - icons-demo
            - token-converter
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        permissions:
            pull-requests: write # to post pull-requests comments
        steps:
            - name: Find comment
              uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
              id: comment
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  issue-number: ${{ github.event.pull_request.number }}
                  comment-author: 'github-actions[bot]'
                  body-includes: '## Deployments'

            - name: Create or update comment
              uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  comment-id: ${{ steps.comment.outputs.comment-id }}
                  issue-number: ${{ github.event.pull_request.number }}
                  body: |
                      ## Deployments

                      ### Icons demo

                      ${{ format('[{0}]({0})', needs.icons-demo.outputs.url) }}

                      ---

                      ### Token converter

                      ${{ format('[{0}]({0})', needs.token-converter.outputs.url) }}

                      ---

                      Workflow ${{ format('[{3}/{2}]({0}/{1}/actions/runs/{2})', github.server_url, github.repository, github.run_id, github.workflow) }}
                  reactions: rocket
                  edit-mode: replace

    ok:
        runs-on: ubuntu-latest
        if: always()
        needs:
            - codegen
            - build
            - lint
            - icons-demo
            - token-converter
        env:
            RETURN_CODE: ${{ case(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'), 1, 0) }}
        steps:
            - name: Check for failure
              run: |
                  exit $RETURN_CODE

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Configure AWS
              run: |
                  aws configure set region ${{ vars.AWS_REGION }}
                  aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws configure set request_checksum_calculation when_required
                  aws configure set response_checksum_validation when_required

            - name: Download cdn distributive
              id: pack-cdn
              uses: actions/download-artifact@v8
              with:
                  artifact-ids: ${{ needs.build.outputs.pack-cdn-artifact-id }}
                  path: cdn-dist

            - name: Sync
              run: |
                  aws s3 sync cdn-dist/icons s3://${{ vars.S3_ICONS_BUCKET_NAME }} --endpoint-url=${{ vars.S3_ENDPOINT_URL }}

            - name: Purge cache
              uses: actions/github-script@v8
              env:
                  CDN_API_KEY: ${{ secrets.CDN_API_KEY }}
                  CDN_API_URL: ${{ vars.CDN_API_URL }}
                  CDN_RESOURCE_ID: ${{ vars.CDN_RESOURCE_ID }}
                  CDN_ICONS_PATH: ${{ vars.S3_ICONS_BUCKET_NAME }}
              with:
                  script: |
                      const response = await fetch(new URL(`cdn/resources/${process.env.CDN_RESOURCE_ID}/purge`, process.env.CDN_API_URL), {
                          headers: {
                              Authorization: `APIKey ${process.env.CDN_API_KEY}`,
                              'Content-Type': 'application/json',
                          },
                          method: 'POST',
                          body: JSON.stringify({
                              paths: [`/${process.env.CDN_ICONS_PATH}`],
                          }),
                      });

                      core.info(`response status ${response.status} ${response.ok}`);
