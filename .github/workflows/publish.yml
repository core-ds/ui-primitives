name: publish

on:
    push:
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false
    queue: max

permissions: {} # each job should define its own permission explicitly

jobs:
    select-mode:
        if: ${{ github.repository == 'core-ds/ui-primitives' }}
        runs-on: ubuntu-latest
        outputs:
            mode: ${{ steps.select-mode.outputs.mode }}
            publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
        permissions:
            contents: read # to check out repo (actions/checkout)
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup CI
              uses: $/.github/actions/ci-setup

            - name: Select mode
              id: select-mode
              uses: changesets/action/select-mode@v2

    version:
        needs: select-mode
        if: needs.select-mode.outputs.mode == 'version'
        runs-on: ubuntu-latest
        permissions:
            contents: read # to check out repo (actions/checkout)
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup CI
              uses: $/.github/actions/ci-setup

            - name: Create app token
              uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  client-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write # to create version commits (changesets/action)
                  permission-pull-requests: write # to create pull request (changesets/action)

            - name: Create or update release pull request
              id: changesets
              uses: changesets/action/version@v2
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: 'pnpm version-packages'

    pack:
        needs: select-mode
        if: needs.select-mode.outputs.mode == 'publish'
        runs-on: ubuntu-latest
        outputs:
            pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
            pack-cdn-artifact-id: ${{ steps.pack-cdn.outputs.artifact-id }}
        permissions:
            contents: read # to check out repo (actions/checkout)
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup CI
              uses: $/.github/actions/ci-setup

            - name: Bootstrap
              run: |
                  pnpm bootstrap

            - name: Build artifacts
              run: |
                  pnpm build
                  pnpm build-cdn-dist

            - name: Pack
              id: pack
              uses: changesets/action/pack@v2
              with:
                  publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

            - name: Pack cdn distributive
              id: pack-cdn
              uses: actions/upload-artifact@v7
              with:
                  retention-days: 1
                  name: cdn-dist
                  path: cdn-dist

    publish:
        needs: pack
        runs-on: ubuntu-latest
        permissions:
            contents: write # to create release (changesets/action)
            id-token: write # to use OpenID Connect token for trusted publishing (changesets/action)
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup CI
              uses: $/.github/actions/ci-setup

            - name: Publish to npm
              uses: changesets/action/publish@v2
              with:
                  pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

    deploy:
        needs: pack
        if: vars.CDN_SKIP_DEPLOY != 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Configure AWS cli
              run: |
                  aws configure set region ${{ vars.AWS_REGION }}
                  aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws configure set request_checksum_calculation when_required
                  aws configure set response_checksum_validation when_required

            - name: Unpack
              uses: actions/download-artifact@v8
              with:
                  artifact-ids: ${{ needs.pack.outputs.pack-cdn-artifact-id }}
                  path: cdn-dist

            - name: Sync
              run: |
                  aws s3 sync cdn-dist/icons s3://${{ vars.S3_ICONS_BUCKET_NAME }} --endpoint-url=${{ vars.S3_ENDPOINT_URL }} --no-progress

            - name: Purge cache
              if: vars.CDN_SKIP_CACHE_PURGE != 'true'
              uses: actions/github-script@v8
              env:
                  CDN_API_KEY: ${{ secrets.CDN_API_KEY }}
                  CDN_API_URL: ${{ vars.CDN_API_URL }}
                  CDN_RESOURCE_ID: ${{ vars.CDN_RESOURCE_ID }}
                  CDN_ICONS_PATH: ${{ vars.S3_ICONS_BUCKET_NAME }}
              with:
                  script: |
                      const response = await fetch(new URL(`cdn/resources/${process.env.CDN_RESOURCE_ID}/purge`, process.env.CDN_API_URL), {
                          headers: {
                              Authorization: `APIKey ${process.env.CDN_API_KEY}`,
                              'Content-Type': 'application/json',
                          },
                          method: 'POST',
                          body: JSON.stringify({
                              paths: [`/${process.env.CDN_ICONS_PATH}`],
                          }),
                      });

                      if (!response.ok) {
                          core.setFailed(`Failed to purge cdn cache with status: ${response.status}`);
                      }
