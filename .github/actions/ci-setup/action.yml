name: Setup CI

description: Setup node and install dependencies

runs:
    using: composite
    steps:
        - name: Setup pnpm
          uses: pnpm/action-setup@v6
          with:
              cache: true

        - name: Setup node
          uses: actions/setup-node@v7
          with:
              node-version-file: '.node-version'
              cache: pnpm

        - name: Install dependencies
          shell: bash
          run: |
              pnpm install
